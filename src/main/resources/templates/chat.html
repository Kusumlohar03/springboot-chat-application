<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <title>Real-Time-Chat Application</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <script
        src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js">
    </script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js">
    </script>

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js">
    </script>

</head>

<body>

<div class="container mt-4">

    <h1 class="text-center">Real-Time-Chat Application</h1>

    <!-- Chat Area -->
    <div id="chat"
         class="border rounded p-3 mb-3"
         style="height: 300px; overflow-y: auto;">
    </div>


    <!-- Sender Name -->
    <div class="input-group mb-3">

        <input
            type="text"
            id="senderInput"
            class="form-control"
            placeholder="Your Name" />

    </div>


    <!-- Message Input -->
    <div class="input-group mb-3">

        <input
            type="text"
            id="messageInput"
            class="form-control"
            placeholder="Type a message" />


        <!-- Emoji Button -->
        <button
            type="button"
            id="emojiBtn"
            class="btn">
            😊
        </button>


        <!-- Emoji Picker -->
        <emoji-picker
            id="emojiPicker"
            style="
                display:none;
                width:350px;
                height:200px;
                overflow-y:auto;
            ">
        </emoji-picker>


        <!-- Hidden File Input -->
        <input
            type="file"
            id="fileInput"
            style="display:none;">


        <!-- Attachment Button -->
        <button
            type="button"
            id="attachmentBtn"
            class="btn">
            📎
        </button>


        <!-- Send Button -->
        <div id="input-group-append">

            <button
                id="sendMessage"
                class="btn btn-primary">
                Send
            </button>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- IMAGE PREVIEW MODAL -->
<!-- ========================================= -->

<div
    id="imageModal"
    style="
        display:none;
        position:fixed;
        z-index:9999;
        left:0;
        top:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.85);
        align-items:center;
        justify-content:center;
    ">


    <!-- Close Button -->

    <span
        id="closeImage"
        style="
            position:absolute;
            top:20px;
            right:30px;
            color:white;
            font-size:40px;
            cursor:pointer;
            z-index:10000;
        ">

        &times;

    </span>


    <!-- Large Image -->

    <img
        id="largeImage"
        style="
            max-width:90%;
            max-height:90%;
            object-fit:contain;
            border-radius:8px;
        ">

</div>


<script>


// =========================================
// ELEMENT REFERENCES
// =========================================

const emojiBtn = document.getElementById("emojiBtn");

const emojiPicker = document.getElementById("emojiPicker");

const messageInput = document.getElementById("messageInput");


// =========================================
// EMOJI FUNCTIONALITY
// =========================================

emojiBtn.addEventListener("click", () => {

    if (emojiPicker.style.display === "none") {

        emojiPicker.style.display = "block";

    } else {

        emojiPicker.style.display = "none";

    }

});


emojiPicker.addEventListener("emoji-click", event => {

    messageInput.value += event.detail.unicode;

    messageInput.focus();

});


// =========================================
// ATTACHMENT VARIABLES
// =========================================

var uploadedAttachment = null;


// =========================================
// ATTACHMENT BUTTON
// =========================================

document
    .getElementById("attachmentBtn")
    .addEventListener("click", function () {

        document
            .getElementById("fileInput")
            .click();

    });


// =========================================
// FILE SELECTED
// =========================================

document
    .getElementById("fileInput")
    .addEventListener("change", function () {

        uploadFile();

    });


// =========================================
// UPLOAD FILE
// =========================================

function uploadFile() {

    const fileInput =
        document.getElementById("fileInput");

    const file =
        fileInput.files[0];


    if (!file) {

        alert("Please select a file");

        return;

    }


    const formData =
        new FormData();

    formData.append("file", file);


    fetch("/api/files/upload", {

        method: "POST",

        body: formData

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Upload failed: " + response.status
            );

        }

        return response.text();

    })

    .then(result => {

        uploadedAttachment = {

            url: result,

            name: file.name,

            type: file.type

        };


        console.log(
            "Attachment ready:",
            uploadedAttachment
        );

    })

    .catch(error => {

        console.error(
            "Upload failed:",
            error
        );

        alert("File upload failed.");

    });

}


// =========================================
// OPEN IMAGE MODAL
// =========================================

window.openImage = function(imageUrl) {

    var modal =
        document.getElementById("imageModal");

    var largeImage =
        document.getElementById("largeImage");


    largeImage.src = imageUrl;


    modal.style.display = "flex";

};


// =========================================
// CLOSE IMAGE MODAL
// =========================================

document
    .getElementById("closeImage")
    .addEventListener("click", function () {

        document
            .getElementById("imageModal")
            .style.display = "none";

    });


// =========================================
// CLOSE MODAL WHEN CLICKING BACKGROUND
// =========================================

document
    .getElementById("imageModal")
    .addEventListener("click", function (event) {

        if (event.target === this) {

            this.style.display = "none";

        }

    });


// =========================================
// WEBSOCKET
// =========================================

var stompClient = null;


// =========================================
// CONNECTION STATUS
// =========================================

function setConnected(connected) {

    document
        .getElementById("sendMessage")
        .disabled = !connected;

}


// =========================================
// CONNECT TO WEBSOCKET
// =========================================

function connect() {

    var socket =
        new SockJS("/chat");


    stompClient =
        Stomp.over(socket);


    stompClient.connect(

        {},

        function (frame) {

            console.log(
                "Connected:",
                frame
            );


            setConnected(true);


            stompClient.subscribe(
                "/topic/messages",

                function (message) {

                    showMessage(
                        JSON.parse(message.body)
                    );

                }
            );

        },

        function (error) {

            console.error(
                "STOMP ERROR:",
                error
            );

        }

    );

}


// =========================================
// DISPLAY MESSAGE
// =========================================

function showMessage(message) {

    var chat =
        document.getElementById("chat");


    var messageElement =
        document.createElement("div");


    messageElement.className =
        "border-bottom mb-2 pb-2";


    // =====================================
    // SENDER
    // =====================================

    var senderElement =
        document.createElement("strong");


    senderElement.textContent =
        message.sender + ": ";


    messageElement.appendChild(
        senderElement
    );


    // =====================================
    // TEXT MESSAGE
    // =====================================

    if (message.content) {

        var textElement =
            document.createElement("span");


        textElement.textContent =
            message.content;


        messageElement.appendChild(
            textElement
        );

    }


    // =====================================
    // ATTACHMENT
    // =====================================

    if (message.attachmentUrl) {


        // =================================
        // IMAGE ATTACHMENT
        // =================================

        if (
            message.attachmentType &&
            message.attachmentType.startsWith("image/")
        ) {


            var image =
                document.createElement("img");


            image.src =
                message.attachmentUrl;


            image.alt =
                message.attachmentName;


            image.style.maxWidth =
                "250px";


            image.style.maxHeight =
                "250px";


            image.className =
                "img-fluid rounded d-block mt-2";


            // Make image clickable

            image.style.cursor =
                "pointer";


            image.title =
                "Click to view image";


            // =================================
            // IMAGE CLICK
            // =================================

            image.addEventListener(
                "click",
                function () {

                    window.openImage(
                        message.attachmentUrl
                    );

                }
            );


            messageElement.appendChild(
                image
            );


        } else {


            // =================================
            // OTHER FILE ATTACHMENT
            // =================================

            var fileLink =
                document.createElement("a");


            fileLink.href =
                message.attachmentUrl;


            fileLink.textContent =
                "📎 " +
                message.attachmentName;


            fileLink.target =
                "_blank";


            fileLink.className =
                "d-block mt-2";


            messageElement.appendChild(
                fileLink
            );

        }

    }


    // =====================================
    // ADD MESSAGE TO CHAT
    // =====================================

    chat.appendChild(
        messageElement
    );


    // Scroll to latest message

    chat.scrollTop =
        chat.scrollHeight;

}


// =========================================
// SEND MESSAGE
// =========================================

function sendMessage() {


    var sender =
        document.getElementById(
            "senderInput"
        ).value;


    var content =
        document.getElementById(
            "messageInput"
        ).value;


    var chatMessage = {

        sender: sender,

        content: content,

        attachmentUrl:
            uploadedAttachment
                ? uploadedAttachment.url
                : null,

        attachmentName:
            uploadedAttachment
                ? uploadedAttachment.name
                : null,

        attachmentType:
            uploadedAttachment
                ? uploadedAttachment.type
                : null

    };


    // =====================================
    // SEND THROUGH WEBSOCKET
    // =====================================

    stompClient.send(

        "/app/sendMessage",

        {},

        JSON.stringify(chatMessage)

    );


    // Clear message

    document
        .getElementById("messageInput")
        .value = "";


    // Clear attachment

    uploadedAttachment = null;

}


// =========================================
// SEND BUTTON
// =========================================

document
    .getElementById("sendMessage")
    .onclick = sendMessage;


// =========================================
// CONNECT WHEN PAGE LOADS
// =========================================

window.onload = connect;


</script>

</body>

</html>
