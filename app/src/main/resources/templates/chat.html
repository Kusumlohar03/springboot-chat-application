<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Real-Time-Chat Application</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>
<body>

	<div class="container mt-4">
		<h1 class="text-center">Real-Time-Chat Application</h1>
		<div id="chat" class="border rounded p-3 mb-3"
			style="height: 300px; overflow-y: auto"></div>

		<div class="input-group mb-3">
			<input type="text" id="senderInput" class="form-control"
				placeholder="Your Name" />
		</div>

		<div class="input-group mb-3">
			<input type="text" id="messageInput" class="form-control"
				placeholder="Type a message" />

		<button type="button" id="emojiBtn" class="btn mr-1">😊</button>
			<emoji-picker id="emojiPicker"
				style="display:none; width: 350px; height: 200px; overflow-y: auto;">
			</emoji-picker>


			<div id="input-group-append">
				<button id="sendMessage" class="btn btn-primary">Send</button>
			</div>

		</div>
	</div>
</body>

<script>

//For Emojis
	const emojiBtn = document.getElementById("emojiBtn");
	const emojiPicker = document.getElementById("emojiPicker");
	emojiBtn.addEventListener("click", () => {

	    if (emojiPicker.style.display === "none") {
	        emojiPicker.style.display = "block";
	    } else {
	        emojiPicker.style.display = "none";
	    }
	
	});

	emojiPicker.addEventListener("emoji-click", event => {
	
	    messageInput.value += event.detail.unicode;
	
	    messageInput.focus();
	
	});

var stompClient = null;

	function setConnected(connected){
		document.getElementById('sendMessage').disabled =!connected;
	}

	function connect() {

		var socket = new SockJS('/chat');
		stompClient = Stomp.over(socket);
		stompClient.connect({},function(frame){
			setConnected(true);
			stompClient.subscribe('/topic/messages', function(message){
				showMessage(JSON.parse(message.body));
			});
		},
		function(error) {

	        console.error("STOMP ERROR:", error);
	    }
		
		);
	}
		
		function showMessage(message){
			var chat = document.getElementById('chat');
			var messageElement = document.createElement('div');
			messageElement.textContent = message.sender + ': ' + message.content;
			messageElement.className = "border-bottom mb-1";
			chat.appendChild(messageElement)
			chat.scrollTop = chat.scrollHeight;

		}
		
		function sendMessage(){
			var sender = document.getElementById('senderInput').value;
			var content = document.getElementById('messageInput').value;
			
			var chatMessage ={
				sender: sender,
				content: content
			}
			
			stompClient.send("/app/sendMessage",{},JSON.stringify(chatMessage));
			document.getElementById('messageInput').value = '';
			
		}
		
		document.getElementById('sendMessage').onclick = sendMessage;
		window.onload = connect;
		
		
</script>

</html>
